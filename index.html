<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小贩语音记账</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: #000; color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
  overscroll-behavior: none;
}
.app { max-width: 520px; margin: 0 auto; padding: 16px 16px 100px; }
header { display: flex; justify-content: space-between; align-items: center; padding: 4px 0 18px; }
h1 { font-size: 24px; margin: 0; font-weight: 800; }
#date { opacity: .65; font-size: 14px; }

.totals { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px; }
.card { background: #0d0d0d; border: 1px solid #1a1a1a; border-radius: 18px; padding: 14px 16px; }
.card label { font-size: 13px; opacity: .7; display: block; }
.card .value { font-size: 34px; font-weight: 800; margin-top: 6px; }
.card.cash { box-shadow: inset 3px 0 0 #22c55e; }
.card.cash .value { color: #22c55e; }
.card.tng { box-shadow: inset 3px 0 0 #3b82f6; }
.card.tng .value { color: #3b82f6; }
.card.total { grid-column: 1 / -1; }
.card.total .value { color: #facc15; font-size: 44px; }

.mic-wrap { text-align: center; margin: 20px 0; }
.mic { width: 190px; height: 190px; border-radius: 50%; background: radial-gradient(circle at 30% 20%, #ff5a5a, #dc2626 60%, #991b1b); border: none; color: white; font-size: 20px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 20px 40px rgba(220,38,38,.35); cursor: pointer; margin: 0 auto; }
.mic:active { transform: scale(.94); }
.mic-icon { font-size: 56px; }
#status { margin-top: 14px; font-size: 15px; opacity: .85; height: 22px; }

.heard { background: #0a0a0a; border: 1px solid #222; border-radius: 16px; padding: 14px; margin: 14px 0; }
#lastText { font-size: 20px; font-weight: 700; min-height: 28px; }
.manual { display: flex; gap: 8px; margin-top: 12px; }
.manual input { flex: 1; background: #000; border: 1px solid #333; border-radius: 12px; padding: 14px 12px; color: #fff; font-size: 17px; }
.manual button { padding: 0 16px; border: none; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; }
#addCashBtn { background: #052e16; color: #4ade80; }
#addTngBtn { background: #0b1a3a; color: #60a5fa; }

table { width: 100%; border-collapse: collapse; background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 14px; }
thead th { background: #111; font-size: 13px; padding: 11px 12px; opacity: .75; }
tbody td { padding: 14px 12px; border-top: 1px solid #181818; }
.type-cash { color: #22c55e; }
.type-tng { color: #3b82f6; }

.actions { position: fixed; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 12px 16px; background: #000; max-width: 520px; margin: 0 auto; }
.actions button { height: 58px; border: none; border-radius: 14px; font-size: 18px; font-weight: 800; background: #1c1c1c; color: #fff; cursor: pointer; }
#clearBtn { background: #2a0f0f; color: #fca5a5; }
#settleBtn { background: #facc15; color: #000; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>小贩语音记账</h1>
    <div id="date">-</div>
  </header>

  <div class="totals">
    <div class="card cash">
      <label>现金总额</label>
      <div class="value" id="cashTotal">RM 0.00</div>
    </div>
    <div class="card tng">
      <label>TnG总额</label>
      <div class="value" id="tngTotal">RM 0.00</div>
    </div>
    <div class="card total">
      <label>今日总收入</label>
      <div class="value" id="allTotal">RM 0.00</div>
    </div>
  </div>

  <div class="mic-wrap">
    <button id="micBtn" class="mic">
      <div class="mic-icon">🎤</div>
      <div>按住说话</div>
    </button>
    <div id="status">准备就绪 · 离线可用</div>
  </div>

  <div class="heard">
    <div id="lastText">-</div>
    <div class="manual">
      <input id="manualInput" type="text" placeholder="手动输入...">
      <button id="addCashBtn">记现金</button>
      <button id="addTngBtn">记TnG</button>
    </div>
  </div>

  <div style="margin-top: 24px; margin-bottom: 100px;">
    <div style="font-size: 14px; opacity: .7; margin-bottom: 10px;">
      <span>今日记录</span>
      <span style="float: right;" id="countBadge">0 笔</span>
    </div>
    <table>
      <thead><tr><th>时间</th><th>类型</th><th style="text-align:right">金额</th></tr></thead>
      <tbody id="listBody">
        <tr><td colspan="3" style="text-align:center; opacity: .5;">还没有记录</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="actions">
  <button id="settleBtn">结算</button>
  <button id="undoBtn">撤销</button>
  <button id="clearBtn">清空</button>
</div>

<script>
// --- App Logic ---
const $ = id => document.getElementById(id);
const cashTotalEl = $('cashTotal'), tngTotalEl = $('tngTotal'), allTotalEl = $('allTotal');
const listBody = $('listBody'), lastText = $('lastText'), statusEl = $('status');
const micBtn = $('micBtn'), manualInput = $('manualInput');
const countBadge = $('countBadge');

let records = [];
const todayKey = () => 'hawker-' + new Date().toISOString().slice(0,10);

function fmt(n){ return 'RM ' + n.toFixed(2); }
function timeStr(ts){ const d=new Date(ts); return d.toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'}); }

function loadData(){
  records = JSON.parse(localStorage.getItem(todayKey()) || '[]');
  render();
}
function saveData(){ localStorage.setItem(todayKey(), JSON.stringify(records)); }

function render(){
  const cash = records.filter(r=>r.type==='cash').reduce((s,r)=>s+r.amount,0);
  const tng = records.filter(r=>r.type==='tng').reduce((s,r)=>s+r.amount,0);
  cashTotalEl.textContent = fmt(cash);
  tngTotalEl.textContent = fmt(tng);
  allTotalEl.textContent = fmt(cash+tng);
  countBadge.textContent = records.length + ' 笔';
  
  listBody.innerHTML = '';
  if(records.length===0){
    listBody.innerHTML = `<tr><td colspan="3" style="text-align:center; opacity: .5;">还没有记录</td></tr>`;
    return;
  }
  [...records].reverse().forEach(r=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${timeStr(r.time)}</td><td class="type-${r.type}">${r.type==='cash'?'现金':'TnG'}</td><td style="text-align:right">${r.amount.toFixed(2)}</td>`;
    listBody.appendChild(tr);
  });
}

function addRecord(type, amount){
  if(!amount || amount<=0) return;
  records.push({type, amount: +amount, time: Date.now()});
  saveData(); render();
  statusEl.textContent = `已记 ${type==='cash'?'现金':'TnG'} ${amount}`;
}

function undo(){
  if(records.length===0) return;
  records.pop(); saveData(); render();
}

function clearToday(){
  if(!confirm('确定清空今日所有记录？')) return;
  records=[]; saveData(); render();
}

function settle(){
  const cash = records.filter(r=>r.type==='cash').reduce((s,r)=>s+r.amount,0);
  const tng = records.filter(r=>r.type==='tng').reduce((s,r)=>s+r.amount,0);
  const total = cash+tng;
  statusEl.textContent = `现金${cash.toFixed(0)}, TnG ${tng.toFixed(0)}, 总共${total.toFixed(0)}`;
}

// Buttons
$('addCashBtn').onclick = ()=>{ const m=manualInput.value.match(/(\d+[\.,]?\d{0,2})/); if(m) addRecord('cash', parseFloat(m[1].replace(',','.'))); };
$('addTngBtn').onclick = ()=>{ const m=manualInput.value.match(/(\d+[\.,]?\d{0,2})/); if(m) addRecord('tng', parseFloat(m[1].replace(',','.'))); };
$('undoBtn').onclick = undo;
$('clearBtn').onclick = clearToday;
$('settleBtn').onclick = settle;

// Voice
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isPressing = false;

if(SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.onresult = e => {
    const text = e.results[0][0].transcript;
    lastText.textContent = text;
    manualInput.value = text;
  };
}

micBtn.addEventListener('mousedown', ()=>{
  isPressing = true;
  statusEl.textContent = '聆听中...';
  if(recognition) recognition.start();
});

window.addEventListener('mouseup', ()=>{
  if(!isPressing) return;
  isPressing = false;
  if(recognition) recognition.stop();
  statusEl.textContent = '准备就绪 · 离线可用';
});

function updateDate(){
  const d = new Date();
  $('date').textContent = d.toLocaleDateString('zh-CN',{month:'long',day:'numeric'});
}

updateDate();
loadData();
</script>
</body></html>
