<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小贩快速记账</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #1a1a1a; 
            color: #fff; 
            font-family: Arial, sans-serif;
            padding: 10px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        
        h1 { text-align: center; margin: 15px 0; font-size: 28px; }
        
        .summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .sum-box {
            background: #0d0d0d;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #333;
        }
        
        .sum-label { font-size: 12px; color: #888; margin-bottom: 8px; }
        .sum-value { font-size: 32px; font-weight: bold; }
        .cash-value { color: #4ade80; }
        .tng-value { color: #60a5fa; }
        .total-value { color: #fbbf24; }
        
        .input-area {
            background: #0d0d0d;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 2px solid #333;
        }
        
        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        input[type="number"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #1a1a1a;
            color: #fff;
            font-size: 18px;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        button:active { transform: scale(0.95); }
        
        .btn-cash { background: #22c55e; color: #000; flex: 1; }
        .btn-tng { background: #3b82f6; color: #fff; flex: 1; }
        .btn-quick { 
            background: #666; 
            color: #fff; 
            padding: 10px 15px;
            font-size: 13px;
        }
        
        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .records {
            background: #0d0d0d;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #333;
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .record-item {
            display: flex;
            align-items: flex-start;
            padding: 12px;
            margin-bottom: 10px;
            background: #1a1a1a;
            border-radius: 6px;
            border-left: 4px solid #444;
            gap: 12px;
        }
        
        .record-item.cash { border-left-color: #22c55e; }
        .record-item.tng { border-left-color: #3b82f6; }
        
        .record-number {
            font-weight: bold;
            font-size: 18px;
            color: #888;
            min-width: 30px;
            text-align: center;
        }
        
        .record-info { flex: 1; }
        .record-type { font-size: 12px; font-weight: bold; }
        .record-type.cash { color: #22c55e; }
        .record-type.tng { color: #3b82f6; }
        
        .record-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
            gap: 10px;
        }
        
        .record-amount { 
            font-size: 16px; 
            font-weight: bold;
        }
        
        .record-datetime { 
            font-size: 11px; 
            color: #666;
            text-align: right;
        }
        
        .record-delete {
            background: #7f1d1d;
            color: #fca5a5;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
        }
        
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .btn-settle { background: #fbbf24; color: #000; }
        .btn-undo { background: #666; color: #fff; }
        .btn-clear { background: #7f1d1d; color: #fca5a5; }
        
        .empty-state {
            text-align: center;
            padding: 30px;
            color: #666;
        }
        
        .status-msg {
            text-align: center;
            margin-bottom: 10px;
            font-size: 14px;
            color: #4ade80;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 小贩记账</h1>
        
        <div class="summary">
            <div class="sum-box">
                <div class="sum-label">现金</div>
                <div class="sum-value cash-value" id="cashSum">RM 0</div>
            </div>
            <div class="sum-box">
                <div class="sum-label">TnG</div>
                <div class="sum-value tng-value" id="tngSum">RM 0</div>
            </div>
        </div>
        
        <div class="sum-box" style="margin-bottom: 20px;">
            <div class="sum-label">今日总收入</div>
            <div class="sum-value total-value" id="totalSum">RM 0</div>
        </div>
        
        <div class="status-msg" id="statusMsg"></div>
        
        <div class="input-area">
            <div class="quick-buttons" id="quickButtons"></div>
            
            <div class="input-row">
                <input type="number" id="amountInput" placeholder="输入金额" step="0.01" min="0">
            </div>
            
            <div class="input-row">
                <button class="btn-cash" onclick="addCash()">💵 记现金</button>
                <button class="btn-tng" onclick="addTng()">📱 记TnG</button>
            </div>
        </div>
        
        <div class="records" id="recordsList">
            <div class="empty-state">还没有记录</div>
        </div>
        
        <div class="actions">
            <button class="btn-settle" onclick="showSummary()">结算</button>
            <button class="btn-undo" onclick="undo()">撤销</button>
            <button class="btn-clear" onclick="clearAll()">清空</button>
        </div>
    </div>

    <script>
        // ===== 数据管理 =====
        let records = [];
        
        // 获取今天的日期key
        function getTodayKey() {
            const date = new Date();
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `hawker_${year}_${month}_${day}`;
        }
        
        // 格式化日期和时间
        function formatDateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            return {
                date: `${year}-${month}-${day}`,
                time: `${hours}:${minutes}:${seconds}`,
                fullDateTime: `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`
            };
        }
        
        // 加载数据
        function loadData() {
            const key = getTodayKey();
            const saved = localStorage.getItem(key);
            records = saved ? JSON.parse(saved) : [];
            updateDisplay();
        }
        
        // 保存数据
        function saveData() {
            const key = getTodayKey();
            localStorage.setItem(key, JSON.stringify(records));
        }
        
        // ===== 记录操作 =====
        function addRecord(type, amount) {
            if (!amount || amount <= 0) {
                showStatus('❌ 请输入有效金额');
                return;
            }
            
            const dateTime = formatDateTime();
            records.push({
                type: type,
                amount: parseFloat(amount),
                date: dateTime.date,
                time: dateTime.time,
                fullDateTime: dateTime.fullDateTime,
                timestamp: Date.now()
            });
            
            saveData();
            updateDisplay();
            document.getElementById('amountInput').value = '';
            showStatus(`✓ 已记录 ${type === 'cash' ? '现金' : 'TnG'} RM${amount}`);
        }
        
        function addCash() {
            const amount = document.getElementById('amountInput').value;
            addRecord('cash', amount);
        }
        
        function addTng() {
            const amount = document.getElementById('amountInput').value;
            addRecord('tng', amount);
        }
        
        function undo() {
            if (records.length === 0) {
                showStatus('❌ 没有记录可以撤销');
                return;
            }
            records.pop();
            saveData();
            updateDisplay();
            showStatus('✓ 已撤销');
        }
        
        function clearAll() {
            if (records.length === 0) {
                showStatus('❌ 没有记录');
                return;
            }
            if (confirm('确定要删除今天的所有记录吗？')) {
                records = [];
                saveData();
                updateDisplay();
                showStatus('✓ 已清空');
            }
        }
        
        function deleteRecord(index) {
            records.splice(index, 1);
            saveData();
            updateDisplay();
            showStatus('✓ 已删除');
        }
        
        // ===== 显示更新 =====
        function updateDisplay() {
            updateSummary();
            updateRecordsList();
        }
        
        function updateSummary() {
            let cashSum = 0;
            let tngSum = 0;
            
            records.forEach(r => {
                if (r.type === 'cash') cashSum += r.amount;
                else if (r.type === 'tng') tngSum += r.amount;
            });
            
            document.getElementById('cashSum').textContent = 'RM ' + cashSum.toFixed(2);
            document.getElementById('tngSum').textContent = 'RM ' + tngSum.toFixed(2);
            document.getElementById('totalSum').textContent = 'RM ' + (cashSum + tngSum).toFixed(2);
        }
        
        function updateRecordsList() {
            const list = document.getElementById('recordsList');
            
            if (records.length === 0) {
                list.innerHTML = '<div class="empty-state">还没有记录</div>';
                return;
            }
            
            let html = '';
            // 倒序显示（最新的在上面）
            for (let i = records.length - 1; i >= 0; i--) {
                const r = records[i];
                const typeLabel = r.type === 'cash' ? '现金' : 'TnG';
                const icon = r.type === 'cash' ? '💵' : '📱';
                const sequenceNum = records.length - i; // 序号：1,2,3...
                
                html += `
                    <div class="record-item ${r.type}">
                        <div class="record-number">${sequenceNum}</div>
                        <div class="record-info">
                            <div class="record-type ${r.type}">${icon} ${typeLabel}</div>
                            <div class="record-details">
                                <div class="record-amount">RM ${r.amount.toFixed(2)}</div>
                                <div class="record-datetime">
                                    📅 ${r.date}<br>
                                    🕐 ${r.time}
                                </div>
                            </div>
                        </div>
                        <button class="record-delete" onclick="deleteRecord(${i})">删除</button>
                    </div>
                `;
            }
            list.innerHTML = html;
        }
        
        function showStatus(msg) {
            const statusDiv = document.getElementById('statusMsg');
            statusDiv.textContent = msg;
            setTimeout(() => {
                statusDiv.textContent = '';
            }, 3000);
        }
        
        function showSummary() {
            let cashSum = 0;
            let tngSum = 0;
            
            records.forEach(r => {
                if (r.type === 'cash') cashSum += r.amount;
                else if (r.type === 'tng') tngSum += r.amount;
            });
            
            const total = cashSum + tngSum;
            const msg = `📊 今日结算\n\n现金: RM ${cashSum.toFixed(2)}\nTnG: RM ${tngSum.toFixed(2)}\n\n总计: RM ${total.toFixed(2)}\n\n交易数: ${records.length} 笔`;
            alert(msg);
        }
        
        // ===== 快速按钮 =====
        function initQuickButtons() {
            const amounts = [5, 10, 20, 50];
            const container = document.getElementById('quickButtons');
            
            amounts.forEach(amt => {
                const btn = document.createElement('button');
                btn.className = 'btn-quick';
                btn.textContent = 'RM ' + amt;
                btn.onclick = () => {
                    document.getElementById('amountInput').value = amt;
                };
                container.appendChild(btn);
            });
        }
        
        // ===== 初始化 =====
        window.onload = () => {
            loadData();
            initQuickButtons();
        };
    </script>
</body>
</html>
